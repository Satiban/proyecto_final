services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v2.0.7
    user: "root"
    command: server standalone
    env_file:
      - ./.env
    volumes:
      - datos_kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./data/raw:/data/raw
      - ./dbt:/app/dbt:ro
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_EMAIL}
              password: ${KESTRA_ADMIN_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
          url: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spark:
    image: apache/spark:3.5.3
    user: "root"
    working_dir: /opt/spark/work-dir
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
    env_file:
      - ./.env
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
    volumes:
      - ./spark:/opt/spark/work-dir
      - spark_ivy:/root/.ivy2
    ports:
      - "127.0.0.1:4040:4040"
    restart: unless-stopped

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    working_dir: /app/dbt
    env_file:
      - ./.env
    volumes:
      - ./dbt:/app/dbt
      - ./config/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - datos_mlflow:/mlflow
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: oralsolutions-modelo
      MODEL_ALIAS: champion
      UMBRAL_DECISION: "0.01"
      USAR_MODELO_LOCAL: "false"
      REGISTRAR_SNOWFLAKE: "false"
    volumes:
      - datos_mlflow:/mlflow
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

  tablero:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["streamlit", "run", "monitoreo/tablero.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - ./.env
    environment:
      API_URL: http://api:8000
    volumes:
      - ./monitoreo:/app/monitoreo:ro
      - ./docs:/app/docs:ro
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datos_postgres:
  datos_kestra:
  spark_ivy:
  datos_mlflow: