name: CI - Pruebas y Build API

on:
  push:
  pull_request:

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias del servicio y pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest==8.4.2 httpx==0.28.1

      - name: Ejecutar pruebas automáticas (pipeline + API)
        env:
          USAR_MODELO_LOCAL: "true"
          REGISTRAR_SNOWFLAKE: "false"
        run: pytest tests -v

      - name: Verificar construcción de imagen Docker de la API
        run: docker build -f api/Dockerfile -t oralsolutions-api:ci .