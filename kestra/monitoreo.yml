id: monitoreo
namespace: oralsolutions.mlops

description: >
  Monitoreo inmediato, evaluación de targets madurados
  y persistencia de alertas en Snowflake.

inputs:
  - id: lote
    type: INT
    required: true
    defaults: 0
    min: 0
    max: 14

  - id: fecha_virtual
    type: STRING
    required: false

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: ejecutar_monitoreo_temporal
    type: io.kestra.plugin.scripts.python.Commands

    containerImage: python:3.14-slim

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: proyecto_final_default
      volumes:
        - "{{ envs.kestra_host_project_path }}:/proyecto:ro"

    env:
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      NUMERO_LOTE: "{{ inputs.lote }}"
      FECHA_VIRTUAL: "{{ inputs.fecha_virtual ?? '' }}"

    beforeCommands:
      - pip install -q -r /proyecto/api/requirements.txt
      - pip install -q python-dotenv==1.2.1

    commands:
      - cd /proyecto
      - |
        if [ -n "$FECHA_VIRTUAL" ]; then
          python -m monitoreo.orquestar_monitoreo \
            --lote "$NUMERO_LOTE" \
            --fecha-virtual "$FECHA_VIRTUAL"
        else
          python -m monitoreo.orquestar_monitoreo \
            --lote "$NUMERO_LOTE"
        fi